[workspace]
authors = ["Yusuf Maulana <yusufdjuanda@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "perd-perturbation"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
test = "pytest -q"
lint = "ruff check src scripts tests demo"
demo = "python demo/run_demo.py"
make-toy-data = "python demo/make_toy_data.py"
notebook = "jupyter lab demo/demo.ipynb"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[dependencies]
python = "3.11.*"
pandas = ">=3.0.5,<4"
numpy = ">=2.4.6,<3"
pyarrow = ">=25.0.0,<26"
openpyxl = ">=3.1.5,<4"
scikit-learn = ">=1.9.0,<2"
joblib = ">=1.5.3,<2"
pytest = ">=9.0.2,<10"
ruff = ">=0.14.14,<0.15"
jupyterlab = ">=4.6.4,<5"
ipykernel = ">=7.4.0,<8"
matplotlib = ">=3.11.2,<4"
nbformat = ">=5.11.1,<6"
nbconvert = ">=7.17.1,<8"
pyranges = ">=0.1.4,<0.2"

[feature.bio.target.linux-64.dependencies]
bowtie2 = ">=2.5.5,<3"
samtools = ">=1.24,<2"
salmon = ">=2.8.0,<3"
bedtools = ">=2.31.1,<3"
fastp = ">=1.3.7,<2"
lbzip2 = ">=2.5,<3"
pybigwig = ">=0.3.26,<0.4"

[feature.r.target.linux-64.dependencies]
r-base = ">=4.5.3,<4.6"
bioconductor-limma = ">=3.66.0,<4"
r-ggplot2 = ">=4.0.3,<5"
r-ragg = ">=1.5.2,<2"

[environments]
bio = { features = ["bio"], solve-group = "default" }
r = { features = ["r"], no-default-feature = true }
